[tox]
min_version = 4.22
requires =
    tox>=4.22
    tox-uv>=1.23
env_list =
    py311-django52
    py{312,313,314}-django{52,60,61}
    lint

# Python 3.15 release-candidate envs are not part of the default run.
# Invoke them explicitly:
#   uv run tox -e py315-django52
#   uv run tox -e py315-django60
#   uv run tox -e py315-django61

[testenv]
runner = uv-venv-runner
package = wheel
dependency_groups = test
# The package depends on Django>=5.2. Keep the deps pin when that
# requirement is installed, instead of upgrading to the newest release.
constrain_package_deps = true
# Parallel tox runs must not share one coverage data file.
set_env =
    COVERAGE_FILE = {envdir}/.coverage
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    coverage run --source newsfeed runtests.py {posargs}

[testenv:lint]
skip_install = true
dependency_groups = lint
deps =
commands =
    ruff check newsfeed tests test_project runtests.py manage.py
