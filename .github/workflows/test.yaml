name: Django Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]

        exclude:
          # Django 6.0 and 6.1 require Python 3.12 or newer.
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install 3.14 ${{ matrix.python-version }}

      - name: Run tests with Python ${{ matrix.python-version }} and Django ${{ matrix.django-version }}
        run: |
          uv sync --frozen
          PY_VER=$(echo "${{ matrix.python-version }}" | tr -d .)
          DJ_VER=$(echo "${{ matrix.django-version }}" | tr -d .)
          uv run tox run -e "py${PY_VER}-django${DJ_VER}"

      - name: Publish coverage results
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  prerelease:
    name: Prerelease watch
    runs-on: ubuntu-latest
    # A release candidate can fail here without failing the
    # supported-version jobs above.
    continue-on-error: true

    strategy:
      fail-fast: false

      matrix:
        include:
          # Python 3.15 is in release candidate. Test it with each
          # supported Django series.
          - python-version: "3.15"
            django-version: "5.2"
          - python-version: "3.15"
            django-version: "6.0"
          - python-version: "3.15"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: |
          uv python install 3.14 ${{ matrix.python-version }}
          "$(uv python find "${{ matrix.python-version }}")" --version

      - name: Run tests with Python ${{ matrix.python-version }} and Django ${{ matrix.django-version }}
        run: |
          uv sync --frozen
          PY_VER=$(echo "${{ matrix.python-version }}" | tr -d .)
          DJ_VER=$(echo "${{ matrix.django-version }}" | tr -d .)
          uv run tox run -e "py${PY_VER}-django${DJ_VER}"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Run Ruff
        run: |
          uv sync --frozen
          uv run tox run -e lint
